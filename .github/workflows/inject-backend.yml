name: Wire MENUO runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject MENUO runtime bridges
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('</script>\\n', '</script>\n')
          old = '<script src="menuo-qr-auth-fix.js" defer></script>'
          new = '<script src="menuo-auth.js" defer></script>'
          if old in s:
              s = s.replace(old, new)
          tags = [
              '<script src="menuo-auth.js?v=2026092503" defer></script>',
              '<script src="menuo-backend.js?v=2026092503" defer></script>',
              '<script src="menuo-visitor-fix.js?v=2026092503" defer></script>'
          ]
          s = '\n'.join(line for line in s.splitlines() if 'script src="menuo-' not in line)
          marker = '</head>'
          if marker not in s:
              raise SystemExit('head marker not found')
          for tag in tags:
              if tag not in s:
                  s = s.replace(marker, tag + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire production MENUO authentication" || exit 0
          git push
