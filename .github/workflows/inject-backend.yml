name: Wire MENUO backend

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject MENUO runtime bridges
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          # Remove the accidental literal characters backslash+n left by an older workflow.
          s = s.replace('</script>\\n', '</script>\n')
          tags = [
              '<script src="menuo-qr-auth-fix.js" defer></script>',
              '<script src="menuo-backend.js" defer></script>',
              '<script src="menuo-visitor-fix.js" defer></script>'
          ]
          marker = '</head>'
          if marker not in s:
              raise SystemExit('head marker not found')
          for tag in tags:
              if tag not in s:
                  s = s.replace(marker, tag + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix MENUO QR account synchronization" || exit 0
          git push
