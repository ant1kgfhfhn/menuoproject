name: Fix MENUO auth script

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix invalid await inside Array.find
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "const u=state.users.find(x=>x.email===email&&x.passwordHash===await hash(pass));"
          new = "const passHash=await hash(pass);const u=state.users.find(x=>x.email===email&&x.passwordHash===passHash);"
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix auth await syntax" || exit 0
          git push
